<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 72" preserveAspectRatio="xMidYMid slice" width="1400" height="72">
  <defs>

    <!-- Deep navy base -->
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#050916" stop-opacity="1"/>
      <stop offset="38%"  stop-color="#070d22" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#09102e" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#0c0a28" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08091e" stop-opacity="1"/>
    </linearGradient>

    <!-- Wide outer purple nebula cloud - fills center-right region -->
    <radialGradient id="nebulaOuter" cx="68%" cy="50%" r="38%" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#6d28d9" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#5b21b6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary purple bloom slightly left of centre -->
    <radialGradient id="nebulaSecondary" cx="55%" cy="50%" r="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- The elliptical ring glow — diffuse purple halo around the arc -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#9333ea" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#7e22ce" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Hot-spot glow: bright pink-white at the 4-o'clock position of the arc -->
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="12%"  stop-color="#f9a8d4" stop-opacity="0.85"/>
      <stop offset="28%"  stop-color="#ec4899" stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Streak / tail emanating from hotspot toward upper left -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#e879f9" stop-opacity="0.18"/>
      <stop offset="75%"  stop-color="#f0abfc" stop-opacity="0.55"/>
      <stop offset="90%"  stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Inner arc ring stroke gradient -->
    <linearGradient id="arcStroke" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse"
      x1="700" y1="0" x2="1150" y2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="65%"  stop-color="#c084fc" stop-opacity="0.75"/>
      <stop offset="82%"  stop-color="#f0abfc" stop-opacity="0.90"/>
      <stop offset="90%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Clipping so nothing bleeds outside the bar -->
    <clipPath id="barClip">
      <rect x="0" y="0" width="1400" height="72"/>
    </clipPath>

  </defs>

  <g clip-path="url(#barClip)">

    <!-- Layer 1: Base navy fill -->
    <rect x="0" y="0" width="1400" height="72" fill="url(#baseGrad)"/>

    <!-- Layer 2: Wide purple nebula clouds -->
    <rect x="0" y="0" width="1400" height="72" fill="url(#nebulaOuter)"/>
    <rect x="0" y="0" width="1400" height="72" fill="url(#nebulaSecondary)"/>

    <!-- Layer 3: Star field — sparse, small, varied opacity -->
    <!-- Far left stars -->
    <circle cx="42"   cy="14" r="0.7" fill="#ffffff" fill-opacity="0.30"/>
    <circle cx="118"  cy="52" r="0.5" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="195"  cy="28" r="0.9" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="267"  cy="61" r="0.5" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="310"  cy="11" r="0.6" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="388"  cy="40" r="0.4" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="450"  cy="19" r="0.7" fill="#c4b5fd" fill-opacity="0.30"/>
    <!-- Centre-left stars -->
    <circle cx="520"  cy="55" r="0.5" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="580"  cy="8"  r="0.8" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="630"  cy="44" r="0.4" fill="#c4b5fd" fill-opacity="0.20"/>
    <circle cx="680"  cy="22" r="0.6" fill="#ffffff" fill-opacity="0.22"/>
    <!-- Centre — near the arc -->
    <circle cx="720"  cy="10" r="0.7" fill="#e9d5ff" fill-opacity="0.35"/>
    <circle cx="755"  cy="62" r="0.5" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="790"  cy="18" r="1.0" fill="#c4b5fd" fill-opacity="0.28"/>
    <circle cx="820"  cy="50" r="0.4" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Around the arc / nebula zone -->
    <circle cx="860"  cy="12" r="0.6" fill="#e9d5ff" fill-opacity="0.40"/>
    <circle cx="900"  cy="58" r="0.5" fill="#f0abfc" fill-opacity="0.22"/>
    <circle cx="932"  cy="28" r="0.8" fill="#e9d5ff" fill-opacity="0.32"/>
    <circle cx="975"  cy="6"  r="0.5" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Right of arc -->
    <circle cx="1050" cy="38" r="0.4" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="1090" cy="15" r="0.7" fill="#e9d5ff" fill-opacity="0.28"/>
    <circle cx="1140" cy="60" r="0.5" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="1200" cy="22" r="0.6" fill="#c4b5fd" fill-opacity="0.20"/>
    <circle cx="1260" cy="48" r="0.4" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="1320" cy="10" r="0.8" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="1370" cy="35" r="0.5" fill="#e9d5ff" fill-opacity="0.20"/>

    <!-- Layer 4: The gravitational lens / orbital ellipse
         The arc is a wide, shallow ellipse centered around x=950 y=36 (bar centre)
         Major axis ~520px wide, minor axis ~28px tall
         We draw just the visible arc portion (not full ellipse)
         using a path so we can clip to the visible portion          -->

    <!-- Outer diffuse ring glow — slightly larger ellipse, very soft -->
    <ellipse cx="950" cy="36" rx="280" ry="36"
      fill="none"
      stroke="url(#ringGlow)"
      stroke-width="22"
      stroke-opacity="0.45"
    />

    <!-- Main arc ring — the crisp purple orbital line -->
    <ellipse cx="950" cy="36" rx="270" ry="29"
      fill="none"
      stroke="url(#arcStroke)"
      stroke-width="1.8"
      stroke-opacity="0.90"
    />

    <!-- Softer second arc slightly inside — adds depth / glow width -->
    <ellipse cx="950" cy="36" rx="268" ry="27"
      fill="none"
      stroke="#a855f7"
      stroke-width="3.5"
      stroke-opacity="0.22"
    />

    <!-- Layer 5: Hot-spot at roughly 4 o'clock of ellipse
         On ellipse cx=950 cy=36 rx=270 ry=29, at angle ~50deg:
         x = 950 + 270*cos(50°) ≈ 950 + 270*0.643 ≈ 1124
         y = 36  + 29*sin(50°)  ≈ 36  + 29*0.766  ≈ 58
         But reference shows it more to the right and slightly above centre.
         Tweaking to x≈1190 y≈45 for visual match.                         -->

    <!-- Hotspot outer diffuse bloom -->
    <circle cx="1192" cy="44" r="38" fill="url(#hotspot)" fill-opacity="0.90"/>

    <!-- Hotspot tight inner glow -->
    <circle cx="1195" cy="43" r="9"  fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="1195" cy="43" r="4"  fill="#ffffff" fill-opacity="1.00"/>

    <!-- Layer 6: Streak / comet tail trailing from hotspot toward upper-left
         A thin bright line / path that fades out -->

    <!-- Streak — wide soft version -->
    <path d="M 1190 43 Q 1050 30 880 36 Q 760 40 700 36"
      fill="none"
      stroke="#e879f9"
      stroke-width="6"
      stroke-opacity="0.12"
      stroke-linecap="round"
    />

    <!-- Streak — medium crisp version -->
    <path d="M 1192 43 Q 1080 32 930 37 Q 820 40 740 37"
      fill="none"
      stroke="#f0abfc"
      stroke-width="2.2"
      stroke-opacity="0.40"
      stroke-linecap="round"
    />

    <!-- Streak — hair-thin bright core -->
    <path d="M 1194 43 Q 1120 35 1020 38 Q 960 40 920 39"
      fill="none"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-opacity="0.65"
      stroke-linecap="round"
    />

    <!-- Layer 7: Subtle left-edge vignette so logo area stays very dark -->
    <rect x="0" y="0" width="320" height="72"
      fill="url(#baseGrad)"
      fill-opacity="0.55"
    />

  </g>
</svg>
