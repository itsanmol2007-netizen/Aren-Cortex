<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AREN Cortex</title>

    <!-- PWA. vite-plugin-pwa injects <link rel="manifest"> and the SW
         registration; these are the bits it does not: the installed-app
         chrome colour, the iOS home-screen icon, and iOS standalone mode
         (Android reads all of this from the manifest). -->
    <meta name="theme-color" content="#0b1733" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cortex" />
    <!-- Front Desk display/UI families (Manrope + Inter). Referenced by the
         frontdesk Tailwind utilities; loaded here so they actually render.

         INTER IS REQUESTED AS A VARIABLE FONT, and that is not a preference.
         This used to ask for `Inter:wght@400;500;600;700` — four static cuts —
         while consult.css sets 450, 480, 520, 550, 600, 620, 640, 650 and 660
         across the workspace. Every one of those snapped to the nearest of the
         four, so a title at 700 and a value at 640 rendered IDENTICALLY, and
         the whole carefully-tuned weight ramp collapsed into three visible
         steps. The type hierarchy was being written and then thrown away at
         load time.

         `opsz` is requested too: Inter v4's optical size axis opens the
         counters and loosens the spacing at small sizes, which is exactly the
         condition this screen lives in — 11-13px text on a dim clinic panel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Login screen families (landing-page identity): Geist + Geist Mono +
         Newsreader. System fallbacks apply offline.
         Newsreader italic 600 added 2026-09-12 for Overview's own greeting
         (`DoctorOverviewPage.tsx`) — without it the browser would have faked
         a bold weight on top of the only italic cut actually loaded (400),
         which looks distorted on a serif face at that size. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,600&display=swap"
      rel="stylesheet"
    />
    <!-- Devanagari for Hindi prescriptions (PrescriptionDocument.tsx,
         ReviewModal.tsx) — a first-class typeface, not a fallback
         substitution. Arial (the print doc's Latin face) has no Devanagari
         glyphs at all; without this the browser falls back to whatever
         Devanagari font the OS happens to have, with no guarantee of correct
         conjunct/matra shaping. Noto Sans Devanagari is Google's own
         production font for the script — full shaping support, and it pairs
         visually with a plain grotesque sans the way Arial/Inter already do.
         400/500/600/700 to cover body text through headings. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
