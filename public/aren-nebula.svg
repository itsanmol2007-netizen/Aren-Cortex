<svg width="1400" height="64" viewBox="0 0 1400 64" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blur filters -->
    <filter id="blurXXL" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="blurXL" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurLG" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurMD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blurSM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="55%" stop-color="#050916"/>
      <stop offset="100%" stop-color="#060a18"/>
    </linearGradient>

    <!-- Nebula cloud radial gradients -->
    <radialGradient id="cloudViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d8b4fe" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudDeep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Core stellar glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="12%" stop-color="#f5d0fe" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#e879f9" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="25%" stop-color="#ddd6fe" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Arc energy gradients -->
    <linearGradient id="arcMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#e879f9" stop-opacity="0.48"/>
      <stop offset="75%" stop-color="#ddd6fe" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcFaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Left fade mask -->
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050916" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050916" stop-opacity="0"/>
    </linearGradient>
    <!-- Right vignette mask (keeps stat pills readable) -->
    <linearGradient id="rightVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050916" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050916" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <!-- ── Base background ── -->
  <rect width="1400" height="64" fill="url(#bg)"/>

  <!-- ── Layer 1: Wide outer nebula body (deep, blurred) ── -->
  <!-- Main violet mass — broad, centered-right -->
  <ellipse cx="870" cy="38" rx="420" ry="110" fill="url(#cloudViolet)" filter="url(#blurXXL)"/>
  <!-- Deep indigo underlayer gives it weight -->
  <ellipse cx="840" cy="44" rx="300" ry="85" fill="url(#cloudDeep)" filter="url(#blurXXL)"/>
  <!-- Blue-indigo cold wing bleeding left -->
  <ellipse cx="700" cy="28" rx="240" ry="60" fill="url(#cloudBlue)" filter="url(#blurXL)"/>

  <!-- ── Layer 2: Mid nebula — denser core region ── -->
  <ellipse cx="860" cy="28" rx="250" ry="68" fill="url(#cloudPurple)" filter="url(#blurXL)"/>
  <ellipse cx="930" cy="42" rx="190" ry="55" fill="url(#cloudViolet)" filter="url(#blurLG)"/>
  <!-- Rose/pink tendril curling above center -->
  <ellipse cx="800" cy="14" rx="160" ry="40" fill="url(#cloudRose)" filter="url(#blurLG)"/>
  <!-- Second rose puff lower right -->
  <ellipse cx="980" cy="50" rx="140" ry="36" fill="url(#cloudRose)" filter="url(#blurLG)"/>

  <!-- ── Layer 3: Tight bright nucleus ── -->
  <ellipse cx="878" cy="26" rx="90" ry="32" fill="url(#cloudPurple)" filter="url(#blurMD)"/>
  <ellipse cx="855" cy="22" rx="55" ry="22" fill="url(#cloudRose)" filter="url(#blurMD)"/>

  <!-- ── Layer 4: Energy arcs ── -->
  <!-- Primary sweeping arc through nebula center -->
  <path d="M560 52 C680 18 820 6 930 16 C1020 24 1080 36 1160 50"
        fill="none" stroke="url(#arcMain)" stroke-width="1.4"
        stroke-linecap="round"/>
  <!-- Secondary fainter arc, slightly offset -->
  <path d="M600 56 C730 28 860 12 970 22 C1060 30 1120 44 1200 58"
        fill="none" stroke="url(#arcFaint)" stroke-width="0.9"
        stroke-linecap="round"/>
  <!-- Short bright filament near nucleus -->
  <path d="M790 20 C830 12 870 10 912 18"
        fill="none" stroke="#e879f9" stroke-width="0.6" opacity="0.40"
        stroke-linecap="round"/>

  <!-- ── Layer 5: Stellar core glows ── -->
  <!-- Primary stellar point — sits just left of visual center-right -->
  <circle cx="856" cy="20" r="28" fill="url(#coreGlow)" filter="url(#blurMD)"/>
  <circle cx="856" cy="20" r="10" fill="url(#coreGlow2)" filter="url(#blurSM)"/>
  <!-- Pinprick hard center -->
  <circle cx="856" cy="20" r="1.6" fill="#ffffff" opacity="0.96"/>
  <!-- Secondary smaller glow -->
  <circle cx="918" cy="34" r="16" fill="url(#coreGlow)" filter="url(#blurMD)" opacity="0.55"/>
  <circle cx="918" cy="34" r="0.9" fill="#f5d0fe" opacity="0.85"/>

  <!-- ── Layer 6: Star field ── -->
  <!-- Left ambient stars -->
  <circle cx="612" cy="15" r="0.7" fill="#c4b5fd" opacity="0.60"/>
  <circle cx="648" cy="48" r="0.6" fill="#fff" opacity="0.45"/>
  <circle cx="680" cy="28" r="0.8" fill="#ddd6fe" opacity="0.55"/>
  <circle cx="722" cy="10" r="0.7" fill="#fff" opacity="0.50"/>
  <circle cx="744" cy="52" r="0.6" fill="#c4b5fd" opacity="0.45"/>
  <!-- Core region stars (brighter, some glowing) -->
  <circle cx="776" cy="18" r="0.9" fill="#fff" opacity="0.75"/>
  <circle cx="808" cy="44" r="0.7" fill="#f0abfc" opacity="0.70"/>
  <circle cx="830" cy="10" r="1.0" fill="#fff" filter="url(#starGlow)" opacity="0.88"/>
  <circle cx="880" cy="48" r="0.7" fill="#e9d5ff" opacity="0.65"/>
  <circle cx="903" cy="8" r="1.1" fill="#fff" filter="url(#starGlow)" opacity="0.82"/>
  <circle cx="944" cy="40" r="0.8" fill="#c4b5fd" opacity="0.60"/>
  <!-- Right trailing stars -->
  <circle cx="975" cy="14" r="0.8" fill="#fff" opacity="0.55"/>
  <circle cx="1010" cy="52" r="0.6" fill="#ddd6fe" opacity="0.42"/>
  <circle cx="1048" cy="20" r="0.7" fill="#fff" opacity="0.48"/>
  <circle cx="1092" cy="44" r="0.6" fill="#c4b5fd" opacity="0.38"/>
  <circle cx="1130" cy="16" r="0.8" fill="#fff" opacity="0.40"/>
  <circle cx="1175" cy="50" r="0.6" fill="#fff" opacity="0.32"/>
  <circle cx="1218" cy="26" r="0.7" fill="#ddd6fe" opacity="0.28"/>

  <!-- ── Layer 7: Masks ── -->
  <!-- Left hard fade — keeps logo area clean -->
  <rect width="520" height="64" fill="url(#leftFade)"/>
  <!-- Right soft vignette — keeps stat pills readable -->
  <rect x="1080" width="320" height="64" fill="url(#rightVignette)"/>
</svg>